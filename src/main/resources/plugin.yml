name: Color
main: dev.color.ColorPlugin
version: 1.0.2
author: Ezorp
description: Color other players' names (nametag and tab list), visible only to you.
commands:
  color:
    description: Open a color GUI for up to 10 players, or a player picker when run without arguments
    usage: /color [player] [player2] ... (up to 10)


