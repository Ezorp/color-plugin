name: Color
main: dev.color.ColorPlugin
version: 1.1.0
author: Ezorp
softdepend: [ProtocolLib]
description: Color other players' names, or put a colored dot before them (nametag and tab list), visible only to you.
commands:
  color:
    description: Open a color GUI for up to 10 players, or a player picker when run without arguments
    usage: /color [player] [player2] ... (up to 10)
  colordot:
    description: Open a dot color GUI for up to 10 players, or a player picker when run without arguments
    usage: /colordot [player] [player2] ... (up to 10)


